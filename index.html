<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Personal Profile & Markdown Viewer</title>
    <!-- Google Fonts for crisp typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- Marked.js for robust markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-color: #0f1115;
            --sidebar-bg: #161920;
            --card-bg: #1c202a;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.15);
            --border-color: #2d3748;
            --transition: all 0.25s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            overflow-x: hidden;
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-color);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        /* Layout Container */
        .wrapper {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }

        /* Left Sidebar (West Side) */
        aside.sidebar {
            width: 320px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2.5rem 2rem;
            position: fixed;
            height: 100vh;
            top: 0;
            left: 0;
            z-index: 100;
            overflow-y: auto;
        }

        .profile-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            width: 100%;
        }

        /* Square Profile Picture */
        .pfp-wrapper {
            width: 110px;
            height: 110px;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid var(--border-color);
            margin-bottom: 1.5rem;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            background-color: var(--card-bg);
        }

        .pfp-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .pfp-wrapper:hover img {
            transform: scale(1.05);
        }

        .profile-name {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            margin-bottom: 0.25rem;
        }

        .profile-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: var(--accent);
            margin-bottom: 1rem;
        }

        .profile-bio {
            font-size: 0.925rem;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 2rem;
        }

        /* Sidebar Nav Links */
        .nav-links {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            width: 100%;
            margin-bottom: 2rem;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: var(--transition);
        }

        .nav-link svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            flex-shrink: 0;
        }

        .nav-link:hover {
            background-color: var(--card-bg);
            color: var(--text-main);
            transform: translateX(4px);
        }

        .nav-link.active {
            background-color: var(--accent-glow);
            color: var(--accent);
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        .sidebar-footer {
            font-size: 0.75rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            padding-top: 1.25rem;
            width: 100%;
        }

        /* Right Main Content Area (Markdown Viewer) */
        main.main-content {
            margin-left: 320px;
            flex: 1;
            padding: 3rem 4rem;
            max-width: 1000px;
        }

        .markdown-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 3rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        /* Styling rendered Markdown elements */
        .markdown-body {
            color: var(--text-main);
            font-size: 1rem;
            line-height: 1.75;
            word-wrap: break-word;
        }

        .markdown-body h1, 
        .markdown-body h2, 
        .markdown-body h3, 
        .markdown-body h4 {
            color: #ffffff;
            font-weight: 700;
            margin-top: 2rem;
            margin-bottom: 1rem;
            letter-spacing: -0.02em;
        }

        .markdown-body h1 {
            font-size: 2.25rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.75rem;
            margin-top: 0;
        }

        .markdown-body h2 {
            font-size: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
        }

        .markdown-body h3 {
            font-size: 1.25rem;
        }

        .markdown-body p {
            margin-bottom: 1.25rem;
            color: var(--text-muted);
        }

        .markdown-body a {
            color: var(--accent);
            text-decoration: none;
            border-bottom: 1px dotted var(--accent);
            transition: var(--transition);
        }

        .markdown-body a:hover {
            border-bottom-style: solid;
        }

        .markdown-body ul, .markdown-body ol {
            margin-bottom: 1.25rem;
            padding-left: 1.5rem;
            color: var(--text-muted);
        }

        .markdown-body li {
            margin-bottom: 0.5rem;
        }

        .markdown-body code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.875rem;
            background-color: rgba(0, 0, 0, 0.3);
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            color: var(--accent);
        }

        .markdown-body pre {
            background-color: #12141a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.25rem;
            overflow-x: auto;
            margin-bottom: 1.25rem;
        }

        .markdown-body pre code {
            background-color: transparent;
            border: none;
            padding: 0;
            color: #e2e8f0;
        }

        .markdown-body blockquote {
            border-left: 4px solid var(--accent);
            padding-left: 1rem;
            margin-left: 0;
            margin-right: 0;
            margin-bottom: 1.25rem;
            color: var(--text-muted);
            font-style: italic;
            background-color: rgba(56, 189, 248, 0.03);
            padding-top: 0.5rem;
            padding-bottom: 0.5rem;
            border-radius: 0 6px 6px 0;
        }

        .markdown-body table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1.25rem;
        }

        .markdown-body th, .markdown-body td {
            border: 1px solid var(--border-color);
            padding: 0.75rem;
            text-align: left;
        }

        .markdown-body th {
            background-color: rgba(255, 255, 255, 0.03);
            color: #ffffff;
        }

        /* Responsive Design */
        @media (max-width: 968px) {
            body {
                flex-direction: column;
            }
            aside.sidebar {
                position: relative;
                width: 100%;
                height: auto;
                padding: 2rem;
            }
            main.main-content {
                margin-left: 0;
                padding: 2rem 1.5rem;
            }
            .markdown-container {
                padding: 1.5rem;
            }
        }
    </style>
</head>
